<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#logoGradient)" stroke="#fff" stroke-width="2"/>

  <!-- LGTM Text -->
  <text x="50" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">LGTM</text>

  <!-- Stack visualization -->
  <rect x="20" y="45" width="25" height="4" fill="rgba(255,255,255,0.8)" rx="2"/>
  <rect x="20" y="52" width="20" height="4" fill="rgba(255,255,255,0.6)" rx="2"/>
  <rect x="20" y="59" width="15" height="4" fill="rgba(255,255,255,0.4)" rx="2"/>
  <rect x="55" y="45" width="25" height="4" fill="rgba(255,255,255,0.8)" rx="2"/>
  <rect x="60" y="52" width="20" height="4" fill="rgba(255,255,255,0.6)" rx="2"/>
  <rect x="65" y="59" width="15" height="4" fill="rgba(255,255,255,0.4)" rx="2"/>
</svg>